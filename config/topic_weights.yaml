# Optional per-topic importance multipliers used by weighting/topic_weight.py.
# Keys MUST match utils.constants.TOPIC_COLUMNS verbatim. Default multiplier is 1.0
# for any topic not listed here (i.e. this file is optional / can be left uniform).

multipliers:
  Prob_Topic_1_Policy_Regulatory: 1.0
  Prob_Topic_2_Financial_Performance: 1.0
  Prob_Topic_3_Investment_FII_DII: 1.0
  Prob_Topic_4_Infrastructure_Expansion: 1.0
  Prob_Topic_5_Stock_Price_Action: 1.0
  Prob_Topic_6_Commodity_Macro: 1.0

descriptions:
  Prob_Topic_1_Policy_Regulatory: >
    Government policy, regulation, licensing, taxation, subsidies, court rulings,
    or ministry/regulator actions affecting the company or sector.
  Prob_Topic_2_Financial_Performance: >
    Quarterly or annual results, revenue, profit, margins, guidance, credit
    rating actions, or other financial-performance disclosures.
  Prob_Topic_3_Investment_FII_DII: >
    Investment activity, stake changes, FII/DII flows, block deals, fund-raising,
    mergers and acquisitions, or capital allocation decisions.
  Prob_Topic_4_Infrastructure_Expansion: >
    New plants, capacity expansion, project commissioning, infrastructure builds,
    partnerships, or major contract/order wins related to physical operations.
  Prob_Topic_5_Stock_Price_Action: >
    Direct commentary on the stock's price movement, analyst target price changes,
    technical levels, trading volume, or brokerage upgrades/downgrades.
  Prob_Topic_6_Commodity_Macro: >
    Commodity price movements (crude oil, coal, natural gas), currency, interest
    rates, or broader macroeconomic factors affecting the energy sector.
